name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**', 'release/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Android Lint (krelay)
        run: ./gradlew :krelay:lintDebug --no-daemon
      - name: Check public API is unchanged
        run: ./gradlew :krelay:apiCheck :krelay-compose:apiCheck --no-daemon

  # ──────────────────────────────────────────────────────────────────────────
  test-android:
    name: Unit Tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run krelay unit tests
        run: ./gradlew :krelay:testDebugUnitTest --no-daemon
      - name: Run krelay-flow unit tests
        run: ./gradlew :krelay-flow:testDebugUnitTest :krelay-flow:jvmTest --no-daemon
      - name: Run JVM and Wasm tests
        run: ./gradlew :krelay:jvmTest :krelay:wasmJsBrowserTest :krelay-flow:wasmJsBrowserTest --no-daemon
      - name: Run krelay-testing unit tests
        run: ./gradlew :krelay-testing:testDebugUnitTest --no-daemon
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: |
            krelay/build/reports/tests/
            krelay-flow/build/reports/tests/
            krelay-testing/build/reports/tests/

  # ──────────────────────────────────────────────────────────────────────────
  test-ios:
    name: Unit Tests (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run krelay iOS simulator tests
        run: ./gradlew :krelay:iosSimulatorArm64Test --no-daemon
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: krelay/build/reports/

  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (All Targets)
    runs-on: macos-14
    needs: [ lint, test-android, test-ios ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build krelay (all targets)
        run: ./gradlew :krelay:assemble --no-daemon
      - name: Build krelay-flow (all targets)
        run: ./gradlew :krelay-flow:assemble --no-daemon
      - name: Build krelay-compose (all targets)
        run: ./gradlew :krelay-compose:assemble --no-daemon
      - name: Build krelay-testing (all targets)
        run: ./gradlew :krelay-testing:assemble --no-daemon
      - name: Build krelay-bom
        run: ./gradlew :krelay-bom:assemble --no-daemon
      - name: Build composeApp demo (Android)
        run: ./gradlew :composeApp:assembleDebug --no-daemon
      - name: Link iOS framework (krelay)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - name: Generate Dokka docs
        run: ./gradlew :krelay:dokkaHtmlCustom --no-daemon
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: krelay-artifacts
          path: krelay/build/outputs/
