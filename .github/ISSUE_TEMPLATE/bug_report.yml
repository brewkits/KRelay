---
name: Bug Report
description: Report a bug or unexpected behavior in KRelay
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the sections below as completely as possible.

  - type: input
    id: version
    attributes:
      label: KRelay Version
      description: Which version of KRelay are you using?
      placeholder: e.g. 2.1.1
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Affected Platform
      description: Which platform(s) are affected?
      multiple: true
      options:
        - Android
        - iOS (device)
        - iOS Simulator
        - Both Android and iOS
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      options:
        - krelay (core)
        - krelay-compose
        - krelay-testing
        - krelay-bom
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Register implementation via `KRelay.register<...>(...)`
        2. Dispatch with `KRelay.dispatch<...> { ... }`
        3. Rotate the device
        4. See error / unexpected behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: stacktrace
    attributes:
      label: Stacktrace / Crash Log
      description: If applicable, paste the full stacktrace here.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please fill in the versions below.
      value: |
        - KRelay version:
        - Kotlin version:
        - Compose Multiplatform version (if relevant):
        - AGP version:
        - Android minSdk / targetSdk:
        - iOS deployment target (if relevant):
        - IDE: Android Studio / IntelliJ (version):
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or relevant code snippets.
